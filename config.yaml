# Social Transcribe 2.0 Configuration File
# Modify these settings as needed

# Whisper Transcription Settings
transcription:
  model_size: "small"  # Options: tiny, base, small, medium, large-v3, large-v3-turbo
  device: "cpu"  # Options: cpu, cuda, auto
  compute_type: "int8"  # Options: int8, float16, float32, auto

# LLM Generator Settings
generator:
  provider: "gemini"  # Options: gemini, openai, ollama
  model_name: "gemini-2.5-flash-lite"  # Examples: gemini-pro, gpt-4o, gpt-3.5-turbo, llama3
  temperature: 0.7  # 0.0-1.0, higher = more creative

# Post Generation Settings
post:
  writing_style: "professional"  # Options: professional, casual, storytelling, technical, motivational, question-based
  word_count: "medium"  # Options: short (100-200), medium (200-400), long (400-600), very-long (600+)
  include_hashtags: true
  include_emoji: false

# API Keys (set via environment variables or .env file)
# GEMINI_API_KEY=your_key_here
# OPENAI_API_KEY=your_key_here
