[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-transcribe"
version = "2.0.0"
description = "Automated content engine: Transcribe videos and generate viral LinkedIn posts"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Vicky Singh", email = "rajpoot.dugri@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "yt-dlp>=2023.10.13",
    "faster-whisper>=0.10.0",
    "ffmpeg-python>=0.2.0",
    "torch>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.3.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/vicky-rajpoot/social-transcribe"
Documentation = "https://github.com/vicky-rajpoot/social-transcribe#readme"
Repository = "https://github.com/vicky-rajpoot/social-transcribe"
Issues = "https://github.com/vicky-rajpoot/social-transcribe/issues"